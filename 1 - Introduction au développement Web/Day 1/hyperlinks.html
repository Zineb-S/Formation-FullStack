<!DOCTYPE html>
<html>
  <head>
    <title>Hyperlink Demo</title>
  </head>
  <body>
    <h1>Welcome to My Website</h1>
    <p>This is my homepage. You can visit other pages using hyperlinks:</p>

    <!-- Simple link -->
    <a href="https://www.google.com">Go to Google</a>

    <br><br>

    <!-- Link that opens in a new tab -->
    <a href="https://www.wikipedia.org" target="_blank">Visit Wikipedia in a new tab</a>

    <br><br>

    <!-- Link to another page in the same site -->
    <a href="about.html">About Me</a>
  </body>
</html>
